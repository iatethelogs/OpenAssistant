name: OpenAssistant .NET build

on:
  push:
    branches: [develop]
    paths:
      - 'software/openassistant-server/**'
      - 'software/openassistant-simulator/**'
      - '.github/workflows/openassistant-build.yml'
  pull_request:
    paths:
      - 'software/openassistant-server/**'
      - 'software/openassistant-simulator/**'
      - '.github/workflows/openassistant-build.yml'

jobs:
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Linux server
        run: dotnet build software/openassistant-server/OpenAssistant.Server.csproj --configuration Release --warnaserror

  windows-simulator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows simulator
        run: dotnet build software/openassistant-simulator/OpenAssistant.Simulator.csproj --configuration Release --warnaserror
