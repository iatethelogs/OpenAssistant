name: Windows simulator

on:
  push:
    paths:
      - 'software/openassistant-simulator/**'
      - '.github/workflows/windows-simulator.yml'
  pull_request:
    paths:
      - 'software/openassistant-simulator/**'
      - '.github/workflows/windows-simulator.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WakeForge inference companion
        run: cargo build --release --manifest-path software/openassistant-simulator/WakeDetector/Cargo.toml
      - name: Build WPF client
        run: dotnet build software/openassistant-simulator/OpenAssistant.Simulator.csproj -c Release
      - name: Publish Windows client
        run: dotnet publish software/openassistant-simulator/OpenAssistant.Simulator.csproj -c Release -r win-x64 --self-contained true -o software/openassistant-simulator/dist
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OpenAssistant-Simulator-win-x64
          path: software/openassistant-simulator/dist/
          if-no-files-found: error
