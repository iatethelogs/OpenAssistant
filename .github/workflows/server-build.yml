name: Server build

on:
  push:
    paths:
      - 'software/openassistant-server/**'
      - '.github/workflows/server-build.yml'
  pull_request:
    paths:
      - 'software/openassistant-server/**'
      - '.github/workflows/server-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build server
        run: dotnet build software/openassistant-server/OpenAssistant.Server.csproj -c Release
