<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenAssistant · Журнал сервера</title><link rel="stylesheet" href="/setup.css"><style>body{background:#f7f9fc}.shell{max-width:1160px}.heading{font-size:clamp(36px,6vw,64px);letter-spacing:-.06em;margin:40px 0 10px}.sub{color:#78889e;font-size:14px;margin-bottom:30px}.logs{background:#111927;color:#c9d9ee;border-radius:20px;padding:24px;min-height:440px;max-height:75vh;overflow:auto;font:12px/1.75 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.filters{display:flex;gap:12px;align-items:center;margin-bottom:15px}.filters select{background:#fff;padding:10px;border:1px solid #dce5ef;border-radius:12px}.header{margin-bottom:25px}</style></head>
<body><div class="shell"><header class="header"><a href="/" class="logo">OPEN<i>ASSISTANT</i></a><div class="top-actions"><a href="/">Мастер настройки</a><a href="/control.html">Панель управления</a></div></header>
<div class="eyebrow">Диагностика / сервер</div><h1 class="heading">Журнал событий.</h1><p class="sub">Сообщения сервера отображаются здесь, а не в терминале. Обновление каждые две секунды.</p>
<div class="filters"><select id="level"><option value="">Все события</option><option value="Information">Информация</option><option value="Warning">Предупреждения</option><option value="Error">Ошибки</option></select><button class="secondary" id="refresh">Обновить</button></div>
<pre id="logs" class="logs">Подключение…</pre></div>
<script>
async function read(){try{const r=await fetch("/api/setup/logs?take=700",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const data=await r.json(),level=document.getElementById("level").value;document.getElementById("logs").textContent=data.filter(x=>!level||x.level===level).map(x=>new Date(x.time).toLocaleTimeString("ru-RU")+" ["+x.level+"] "+x.category+": "+x.message).join("\n")||"Событий пока нет"}catch(e){document.getElementById("logs").textContent="Ошибка: "+e.message}}
document.getElementById("refresh").onclick=read;document.getElementById("level").onchange=read;read();setInterval(read,2000);
</script></body></html>
